name: Dart Package CI/CD

on:
  push:
    branches: ["**", "!main"] # 普通分支推送时触发，合并到 main 时不触发
    tags: ["v*"]              # 推送版本标签时触发
  pull_request:               # 代码合并到 main 之前的 PR 阶段执行校验
    branches: ["main"]

jobs:
  # 1. 守门员：分析通过后才执行后续
  analysis:
    uses: aymtools/flutter-ci/.github/workflows/dart-analysis.yml@main

  # 2. 全自动发布：内部自动识别正式/预发布
  publish:
    needs: [analysis]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    uses: aymtools/flutter-ci/.github/workflows/dart-publish.yml@main
    with:
      main_branch_name: 'main' # 正式版校验的分支名，默认 main